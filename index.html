<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ゆびトレ！けんばん</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>ゆびトレ！けんばん</h1>
    
    <!-- 指番号ガイド（タイトル下） -->
    <div class="finger-guide">
      <div class="guide-item" data-finger="1">
        <div class="guide-number">1</div>
        <div class="guide-label">おやゆび</div>
        <div class="finger-icon">
          <svg viewBox="0 0 50 80" class="finger-svg">
            <ellipse cx="25" cy="40" rx="18" ry="30" fill="white" stroke="black" stroke-width="2"/>
          </svg>
        </div>
      </div>
      <div class="guide-item" data-finger="2">
        <div class="guide-number">2</div>
        <div class="guide-label">ひとさしゆび</div>
        <div class="finger-icon">
          <svg viewBox="0 0 50 80" class="finger-svg">
            <ellipse cx="25" cy="40" rx="12" ry="35" fill="white" stroke="black" stroke-width="2"/>
          </svg>
        </div>
      </div>
      <div class="guide-item" data-finger="3">
        <div class="guide-number">3</div>
        <div class="guide-label">なかゆび</div>
        <div class="finger-icon">
          <svg viewBox="0 0 50 80" class="finger-svg">
            <ellipse cx="25" cy="40" rx="12" ry="38" fill="white" stroke="black" stroke-width="2"/>
          </svg>
        </div>
      </div>
      <div class="guide-item" data-finger="4">
        <div class="guide-number">4</div>
        <div class="guide-label">くすりゆび</div>
        <div class="finger-icon">
          <svg viewBox="0 0 50 80" class="finger-svg">
            <ellipse cx="25" cy="40" rx="11" ry="34" fill="white" stroke="black" stroke-width="2"/>
          </svg>
        </div>
      </div>
      <div class="guide-item" data-finger="5">
        <div class="guide-number">5</div>
        <div class="guide-label">こゆび</div>
        <div class="finger-icon">
          <svg viewBox="0 0 50 80" class="finger-svg">
            <ellipse cx="25" cy="40" rx="9" ry="28" fill="white" stroke="black" stroke-width="2"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- 音の階段鍵盤（画像） -->
    <div class="keyboard-section">
      <img src="1kaidan_0.png?v=2" alt="音の階段鍵盤" class="kaidan-image" id="kaidan">
    </div>

    <!-- コントロール -->
    <div class="control-section">
      <button id="demo-btn">お手本を きく</button>
      <div id="message"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
