<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>音の階段 指トレーニング</title>
    <style>
        body { font-family: sans-serif; background-color: #f5f6fa; text-align: center; margin: 0; padding: 10px; user-select: none; -webkit-user-select: none; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.05); position: relative; }
        #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #big-start-btn { padding: 25px 50px; font-size: 28px; background-color: #ff7675; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 6px 12px rgba(255,118,117,0.4); }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 5px; }
        select, .hand-btn { padding: 8px 12px; font-size: 14px; border-radius: 8px; border: 2px solid #ddd; background: white; cursor: pointer; font-weight: bold; }
        .active-hand { background-color: #ff7675; color: white; border-color: #ff7675; }
        .status-bar { background: #f1f2f6; padding: 8px; border-radius: 10px; font-size: 14px; margin-bottom: 10px; display: flex; justify-content: space-around; font-weight: bold; }
        .msg-box { background: #fff9db; border: 2px solid #fab005; padding: 15px; border-radius: 10px; margin-bottom: 15px; min-height: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .question { font-size: 22px; font-weight: bold; color: #2d3436; line-height: 1.4; }
        .hint { font-size: 18px; color: #ff7675; font-weight: bold; margin-top: 5px; min-height: 24px; }
        .piano-wrapper { position: relative; width: 100%; max-width: 400px; margin: 0 auto; }
        .bg-image { width: 100%; display: block; border-radius: 10px; }
        .touch-area { position: absolute; bottom: 3.5%; left: 6.5%; width: 87%; height: 12%; display: flex; }
        .invisible-key { flex: 1; height: 100%; cursor: pointer; position: relative; background: rgba(0,0,0,0); -webkit-tap-highlight-color: rgba(0,0,0,0); }
        .light-up-0 { background: rgba(255, 59, 48, 0.4) !important; }
        .light-up-1 { background: rgba(255, 149, 67, 0.4) !important; }
        .light-up-2 { background: rgba(255, 204, 0, 0.4) !important; }
        .light-up-3 { background: rgba(0, 199, 129, 0.4) !important; }
        .light-up-4 { background: rgba(90, 200, 250, 0.4) !important; }
        .light-up-5 { background: rgba(52, 85, 165, 0.4) !important; }
        .light-up-6 { background: rgba(229, 92, 176, 0.4) !important; }
        .light-up-7 { background: rgba(255, 59, 48, 0.4) !important; }
        .invisible-key.light-up { animation: blink 0.4s infinite alternate; border-radius: 5px; }
        @keyframes blink { 0% { opacity: 0.1; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div id="start-overlay">
        <h2 style="color:#2d3436; margin-bottom:20px;">おとの階段を はじめよう！</h2>
        <button id="big-start-btn" onclick="ipadAudioUnlock()">スタート 🌟</button>
    </div>

    <div class="controls">
        <select id="song-select" onchange="changeSong()">
            <option value="0">1. チューリップ</option>
            <option value="1">2. 子犬のマーチ</option>
            <option value="2">3. 河は呼んでいる</option>
            <option value="3">4. 糸まき</option>
            <option value="4">5. かっこう</option>
            <option value="5">6. メリーさんの羊</option>
            <option value="6">7. ちょうちょ</option>
            <option value="7">8. ひげじいさん</option>
            <option value="8">9. ぶんぶんぶん</option>
            <option value="9">10. 聖者の行進</option>
        </select>
        <div>
            <button id="btn-right" class="hand-btn active-hand" onclick="setHand('right')">みぎて</button>
            <button id="btn-left" class="hand-btn" onclick="setHand('left')">ひだりて</button>
        </div>
    </div>

    <div class="status-bar">
        <span id="level-display" style="color:#2f3542;">レベル: 1 (お名前モード)</span>
        <span id="score-display">チャレンジ: 0/5 (ノーミス: 0)</span>
    </div>

    <div class="msg-box">
        <div class="question" id="question-text">スタートボタンを おしてね</div>
        <div class="hint" id="hint-text"></div>
    </div>

    <div class="piano-wrapper">
        <img src="1kaidan_0.png" alt="音の階段" class="bg-image" onerror="this.src='https://placehold.co'">
        <div class="touch-area">
            <div class="invisible-key" id="key-0" onclick="pressKey(0)"></div>
            <div class="invisible-key" id="key-1" onclick="pressKey(1)"></div>
            <div class="invisible-key" id="key-2" onclick="pressKey(2)"></div>
            <div class="invisible-key" id="key-3" onclick="pressKey(3)"></div>
            <div class="invisible-key" id="key-4" onclick="pressKey(4)"></div>
            <div class="invisible-key" id="key-5" onclick="pressKey(5)"></div>
            <div class="invisible-key" id="key-6" onclick="pressKey(6)"></div>
            <div class="invisible-key" id="key-7" onclick="pressKey(7)"></div>
        </div>
    </div>
</div>

<script>
    const titles = ["チューリップ", "子犬のマーチ", "河は呼んでいる", "糸まき", "かっこう", "メリーさんの羊", "ちょうちょ", "ひげじいさん", "ぶんぶんぶん", "聖者の行進"];
    const notesStr = ["0,1,2,0,1,2,4,2,1,0,1,2,1", "2,1,0,1,2,2,2,1,1,1,2,4,4,2,1,0,1,2,2,2,1,1,2,1,0", "0,1,2,0,1,2,4,2,1,0,1,2,1", "0,0,0,0,2,2,2,2,4,4,4,4,2,2,2,2", "4,2,2,3,1,1,0,1,2,3,4,4,4", "2,1,0,1,2,2,2,1,1,1,2,4,4,2,1,0,1,2,2,2,1,1,2,1,0", "4,2,2,3,1,1,0,1,2,3,4,4,4", "0,0,0,0,2,2,2,2,4,4,4,4,2,2,2,2,3,3,3,3,2,2,2,2,1,1,1,1,0", "4,3,2,1,0,2,2,1,1,2,2,1,1,4,3,2,1,0", "0,2,3,4,0,2,3,4,0,2,3,4,2,0,2,1"];
    const fingersStr = ["1,2,3,1,2,3,5,3,2,1,2,3,2", "3,2,1,2,3,3,3,2,2,2,3,5,5,3,2,1,2,3,3,3,2,2,3,2,1", "1,2,3,1,2,3,5,3,2,1,2,3,2", "1,1,1,1,3,3,3,3,5,5,5,5,3,3,3,3", "5,3,3,4,2,2,1,2,3,4,5,5,5", "3,2,1,2,3,3,3,2,2,2,3,5,5,3,2,1,2,3,3,3,2,2,3,2,1", "5,3,3,4,2,2,1,2,3,4,5,5,5", "1,1,1,1,3,3,3,3,5,5,5,5,3,3,3,3,4,4,4,4,3,3,3,3,2,2,2,2,1", "5,4,3,2,1,3,3,2,2,3,3,2,2,5,4,3,2,1", "1,3,4,5,1,3,4,5,1,3,4,5,3,1,3,2"];

    const frequencies = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];

    const songData = [];
    for (let i = 0; i < 10; i++) {
        songData.push({
            name: titles[i],
            notes: notesStr[i].split(",").map(Number),
            fingers: fingersStr[i].split(",").map(Number)
        });
    }

    const fingerNames = { 1: 'お父さん指', 2: 'お母さん指', 3: 'お兄さん指', 4: 'お姉さん指', 5: '赤ちゃん指' };
    const leftHandMap = { 1: 5, 2: 4, 3: 3, 4: 2, 5: 1 }; 

    let currentHand = 'right';
    let currentLevel = 1; 
    let songIdx = 0; 
    let melodyIndex = 0;
    let totalAttempts = 0; 
    let noMistakeCount = 0; 
    let hasMistakeInCurrentTurn = false; 
    let audioCtx = null;
    let isTransitioning = false; 

    function ipadAudioUnlock() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
        document.getElementById('start-overlay').style.display = 'none';
        resetGame();
    }

    function playTone(freq, duration = 0.4) {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function resetGame() {
        melodyIndex = 0;
        hasMistakeInCurrentTurn = false;
        isTransitioning = false;
        updateUI();
        highlightKey();
    }

    function changeSong() {
        songIdx = parseInt(document.getElementById('song-select').value);
        resetGame();
    }

    function setHand(hand) {
        currentHand = hand;
        document.getElementById('btn-right').classList.toggle('active-hand', hand === 'right');
        document.getElementById('btn-left').classList.toggle('active-hand', hand === 'left');
        resetGame();
    }

    function updateUI() {
        const song = songData[songIdx];
        if (melodyIndex >= song.notes.length) return;

        const targetNote = song.notes[melodyIndex];
        const rawFinger = song.fingers[melodyIndex];
        
        // ひだりての場合は指の番号をマッピング変換
        const actualFinger = currentHand === 'left' ? leftHandMap[rawFinger] : rawFinger;

        // レベルに応じたメッセージ表示切り替え
        if (currentLevel === 1) {
            document.getElementById('question-text').innerText = `${fingerNames[actualFinger]} をおしてね！`;
        } else {
            document.getElementById('question-text').innerText = `つぎの音をおしてね！`;
        }

        document.getElementById('score-display').innerText = `チャレンジ: ${totalAttempts}/5 (ノーミス: ${noMistakeCount})`;
        document.getElementById('level-display').innerText = `レベル: ${currentLevel} (${currentLevel === 1 ? 'お名前モード' : 'かんがえるモード'})`;
    }

    function highlightKey() {
        // すべてのハイライトをリセット
        for (let i = 0; i < 8; i++) {
            const el = document.getElementById(`key-${i}`);
            el.className = 'invisible-key';
        }

        const song = songData[songIdx];
        if (melodyIndex < song.notes.length) {
            const targetNote = song.notes[melodyIndex];
