<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆびトレ！けんばん</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>ゆびトレ！けんばん</h1>
    
    <!-- 手の甲イラスト -->
    <div class="hand-section">
      <h2>右手の ゆび</h2>
      <div class="hand-illustration">
        <div class="finger" data-finger="1">
          <div class="finger-number">1</div>
          <div class="finger-name">おやゆび</div>
        </div>
        <div class="finger" data-finger="2">
          <div class="finger-number">2</div>
          <div class="finger-name">ひとさしゆび</div>
        </div>
        <div class="finger" data-finger="3">
          <div class="finger-number">3</div>
          <div class="finger-name">なかゆび</div>
        </div>
        <div class="finger" data-finger="4">
          <div class="finger-number">4</div>
          <div class="finger-name">くすりゆび</div>
        </div>
        <div class="finger" data-finger="5">
          <div class="finger-number">5</div>
          <div class="finger-name">こゆび</div>
        </div>
      </div>
    </div>

    <!-- 音の階段鍵盤（画像） -->
    <div class="keyboard-section">
      <img src="1kaidan_0.png?v=2" alt="音の階段鍵盤" class="kaidan-image" id="kaidan">
      <div class="finger-guide">
        <div class="guide-item">
          <div class="guide-number">1</div>
          <div class="guide-label">おやゆび</div>
        </div>
        <div class="guide-item">
          <div class="guide-number">2</div>
          <div class="guide-label">ひとさしゆび</div>
        </div>
        <div class="guide-item">
          <div class="guide-number">3</div>
          <div class="guide-label">なかゆび</div>
        </div>
        <div class="guide-item">
          <div class="guide-number">4</div>
          <div class="guide-label">くすりゆび</div>
        </div>
        <div class="guide-item">
          <div class="guide-number">5</div>
          <div class="guide-label">こゆび</div>
        </div>
      </div>
    </div>

    <!-- コントロール -->
    <div class="control-section">
      <button id="demo-btn">お手本を きく</button>
      <div id="message"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
