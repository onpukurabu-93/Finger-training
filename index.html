<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆびトレ！けんばん</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>ゆびトレ！けんばん</h1>
    
    <!-- 手の甲イラスト -->
    <div class="hand-section">
      <h2>右手の ゆび</h2>
      <div class="hand-illustration">
        <div class="finger" data-finger="1">
          <div class="finger-number">1</div>
          <div class="finger-name">おやゆび</div>
        </div>
        <div class="finger" data-finger="2">
          <div class="finger-number">2</div>
          <div class="finger-name">ひとさしゆび</div>
        </div>
        <div class="finger" data-finger="3">
          <div class="finger-number">3</div>
          <div class="finger-name">なかゆび</div>
        </div>
        <div class="finger" data-finger="4">
          <div class="finger-number">4</div>
          <div class="finger-name">くすりゆび</div>
        </div>
        <div class="finger" data-finger="5">
          <div class="finger-number">5</div>
          <div class="finger-name">こゆび</div>
        </div>
      </div>
    </div>

    <!-- 音の階段鍵盤 -->
    <div class="keyboard-section">
      <h2>おとの かいだん</h2>
      <div class="keyboard">
        <div class="key" data-note="C" data-finger="1">
          <div class="key-label">ド</div>
          <div class="key-finger">1</div>
        </div>
        <div class="key" data-note="D" data-finger="2">
          <div class="key-label">レ</div>
          <div class="key-finger">2</div>
        </div>
        <div class="key" data-note="E" data-finger="3">
          <div class="key-label">ミ</div>
          <div class="key-finger">3</div>
        </div>
        <div class="key" data-note="F" data-finger="4">
          <div class="key-label">ファ</div>
          <div class="key-finger">4</div>
        </div>
        <div class="key" data-note="G" data-finger="5">
          <div class="key-label">ソ</div>
          <div class="key-finger">5</div>
        </div>
      </div>
    </div>

    <!-- コントロール -->
    <div class="control-section">
      <button id="demo-btn">お手本を きく</button>
      <div id="message"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
