<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆびトレ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .buttons {
            margin-bottom: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 0 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .piano-container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }
        .piano-image {
            width: 600px;
            height: 400px;
        }
        .keys {
            position: absolute;
            top: 0;
            left: 0;
            width: 600px;
            height: 400px;
        }
        .white-key {
            position: absolute;
            width: 60px;
            height: 300px;
            background-color: white;
            border: 2px solid #333;
            border-radius: 0 0 5px 5px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            box-sizing: border-box;
        }
        .white-key:hover {
            background-color: #f0f0f0;
        }
        .white-key.active {
            background-color: #ffeb3b;
        }
        .black-key {
            position: absolute;
            width: 40px;
            height: 180px;
            background-color: black;
            border: 2px solid #333;
            border-radius: 0 0 5px 5px;
            z-index: 1;
        }
        .message {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
        .retry-button {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>ゆびトレ</h1>
    <div class="buttons">
        <button id="rightHandBtn" onclick="startRightHand()">みぎて</button>
        <button id="leftHandBtn" onclick="startLeftHand()" disabled>ひだりて</button>
    </div>
    <div class="piano-container">
        <img src="1kaidan_0.png" alt="階段" class="piano-image">
        <div class="keys" id="keys"></div>
    </div>
    <div class="message" id="message"></div>
    <button class="retry-button" id="retryBtn" onclick="retry()">もう一度やる</button>

    <script>
        // 音符と周波数の対応
        const noteFrequencies = {
            'C4': 261.63,
            'D4': 293.66,
            'E4': 329.63,
            'F4': 349.23,
            'G4': 392.00,
            'A4': 440.00,
            'B4': 493.88,
            'C5': 523.25
        };

        // チューリップの旋律（右手）
        const rightHandMelody = [
            { note: 'C4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'C4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'G4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'C4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'C4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'C4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'G4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'C4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'C4', duration: 0.5 }
        ];

        // チューリップの旋律（左手）
        const leftHandMelody = [
            { note: 'C4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'C4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'G4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'C4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'C4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'C4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'G4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'C4', duration: 0.5 },
            { note: 'D4', duration: 0.5 },
            { note: 'E4', duration: 0.5 },
            { note: 'C4', duration: 0.5 }
        ];

        // 指番号（右手）
        const rightHandFingerNumbers = [1, 2, 3, 1, 2, 3, 5, 3, 2, 1, 2, 3, 2, 1, 2, 3, 1, 2, 3, 5, 3, 2, 1, 2, 3, 1];

        // 指番号（左手）
        const leftHandFingerNumbers = [5, 4, 3, 5, 4, 3, 1, 3, 2, 1, 2, 3, 2, 5, 4, 3, 5, 4, 3, 1, 3, 2, 1, 2, 3, 1];

        // 鍵盤の対応（ドレミファソラシド）
        const keyMapping = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'];

        // 現在の状態
        let currentMode = null;
        let currentMelody = [];
        let currentFingerNumbers = [];
        let currentNoteIndex = 0;
        let isDemo = false;
        let audioContext = null;
        let retryTimer = null;

        // 鍵盤を作成
        function createKeys() {
            const keysContainer = document.getElementById('keys');
            keysContainer.innerHTML = '';

            // 白鍵盤を作成（8 個）
            for (let i = 0; i < 8; i++) {
                const key = document.createElement('div');
                key.className = 'white-key';
                key.style.left = (i * 75) + 'px';
                key.style.top = '100px';
                key.dataset.note = keyMapping[i];
                key.dataset.index = i;
                key.onclick = () => handleKeyPress(i);
                keysContainer.appendChild(key);
            }

            // 黒鍵盤を作成（表示のみ）
            const blackKeyPositions = [0, 1, 3, 4, 5];
            for (let i = 0; i < 5; i++) {
                const key = document.createElement('div');
                key.className = 'black-key';
                key.style.left = (blackKeyPositions[i] * 75 + 55) + 'px';
                key.style.top = '100px';
                keysContainer.appendChild(key);
            }
        }

        // 音符を再生
        function playNote(note, duration) {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = noteFrequencies[note];
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        // デモ演奏
        async function playDemo(melody, fingerNumbers) {
            isDemo = true;
            currentNoteIndex = 0;

            for (let i = 0; i < melody.length; i++) {
                const { note, duration } = melody[i];
                const noteIndex = keyMapping.indexOf(note);

                // 鍵盤を光らせる
                const keys = document.querySelectorAll('.white-key');
                keys[noteIndex].classList.add('active');
                keys[noteIndex].textContent = fingerNumbers[i];

                // 音を再生
                playNote(note, duration);

                // 次の音符へ
                await new Promise(resolve => setTimeout(resolve, duration * 1000));

                // 鍵盤を元に戻す
                keys[noteIndex].classList.remove('active');
                keys[noteIndex].textContent = '';
            }

            isDemo = false;
            document.getElementById('message').textContent = 'チャレンジしてね！';
        }

        // 鍵盤を押したときの処理
        function handleKeyPress(noteIndex) {
            if (isDemo || currentNoteIndex >= currentMelody.length) return;

            const expectedNote = currentMelody[currentNoteIndex].note;
            const expectedNoteIndex = keyMapping.indexOf(expectedNote);

            if (noteIndex === expectedNoteIndex) {
                // 正しい鍵盤を押した
                const keys = document.querySelectorAll('.white-key');
                keys[noteIndex].classList.add('active');
                playNote(expectedNote, 0.5);

                currentNoteIndex++;

                if (currentNoteIndex >= currentMelody.length) {
                    // 全部弾き終わった
                    document.getElementById('message').textContent = 'すごい！成功！';
                    keys[noteIndex].classList.remove('active');

                    if (currentMode === 'right') {
                        // 右手モード成功
                        showRetryButton();
                    } else {
                        // 左手モード成功
                        document.getElementById('message').textContent = 'すごい！全部成功！';
                    }
                } else {
                    setTimeout(() => {
                        keys[noteIndex].classList.remove('active');
                    }, 200);
                }
            } else {
                // 間違った鍵盤を押した
                document.getElementById('message').textContent = '残念！もう一回！';
                currentNoteIndex = 0;
            }
        }

        // 右手モード開始
        function startRightHand() {
            currentMode = 'right';
            currentMelody = rightHandMelody;
            currentFingerNumbers = rightHandFingerNumbers;
            currentNoteIndex = 0;
            isDemo = false;

            document.getElementById('rightHandBtn').disabled = true;
            document.getElementById('leftHandBtn').disabled = true;
            document.getElementById('retryBtn').style.display = 'none';
            document.getElementById('message').textContent = 'デモ演奏を聴いてね！';

            // デモ演奏
            playDemo(rightHandMelody, rightHandFingerNumbers).then(() => {
                document.getElementById('message').textContent = 'チャレンジしてね！';
            });
        }

        // 左手モード開始
        function startLeftHand() {
            currentMode = 'left';
            currentMelody = leftHandMelody;
            currentFingerNumbers = leftHandFingerNumbers;
            currentNoteIndex = 0;
            isDemo = false;

            document.getElementById('rightHandBtn').disabled = true;
            document.getElementById('leftHandBtn').disabled = true;
            document.getElementById('retryBtn').style.display = 'none';
            document.getElementById('message').textContent = 'デモ演奏を聴いてね！';

            // デモ演奏
            playDemo(leftHandMelody, leftHandFingerNumbers).then(() => {
                document.getElementById('message').textContent = 'チャレンジしてね！';
            });
        }

        // もう一度やるボタン表示
        function showRetryButton() {
            const retryBtn = document.getElementById('retryBtn');
            retryBtn.style.display = 'inline-block';

            // 10 秒後に自動で左手モード
            retryTimer = setTimeout(() => {
                retryBtn.style.display = 'none';
                startLeftHand();
            }, 10000);
        }

        // もう一度やる
        function retry() {
            clearTimeout(retryTimer);
            startRightHand();
        }

        // 初期化
        createKeys();
    </script>
</body>
</html>
